server {
    listen 8080;

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # QR page — open this in browser to scan WhatsApp QR code
    location /qr-page {
        default_type text/html;
        return 200 '<html><head><meta charset="utf-8"><title>WA QR</title><meta http-equiv="refresh" content="20"><style>body{background:#111;color:#fff;font-family:monospace;padding:20px}pre{font-size:11px;line-height:1.1}</style></head><body><h2>Scan this QR in WhatsApp</h2><p>WhatsApp phone: Settings > Linked Devices > Link a Device</p><p>Page refreshes every 20s</p><pre id=q>Loading...</pre><script>fetch("/api/auth/qr").then(r=>r.json()).then(d=>{document.getElementById("q").textContent=d.qr_text||d.qr||JSON.stringify(d,null,2)}).catch(e=>{document.getElementById("q").textContent=""+e})</script></body></html>';
    }
}
