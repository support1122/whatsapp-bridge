server {
    listen 8080;

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # QR page — open this in browser to scan WhatsApp QR code
    location /qr-page {
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>WhatsApp QR</title><meta http-equiv="refresh" content="20"><style>body{background:#000;color:#fff;font-family:monospace;padding:20px}pre{font-size:10px;line-height:1.1}</style></head><body><h2>WhatsApp Bridge QR Code</h2><p>Page auto-refreshes every 20s. Scan with WhatsApp > Linked Devices > Link a Device</p><pre id="qr">Loading...</pre><script>fetch("/api/auth/qr",{headers:{"Authorization":"Bearer $WHATSAPP_API_TOKEN"}}).then(r=>r.json()).then(d=>{document.getElementById("qr").textContent=d.qr_text||d.qr||JSON.stringify(d,null,2)}).catch(e=>{document.getElementById("qr").textContent="Error: "+e})</script></body></html>';
    }
}
